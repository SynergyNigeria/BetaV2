services:
  - type: web
    name: betabank
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn betabank_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: betabank-db
          property: connectionString

databases:
  - name: betabank-db
    databaseName: betabank
    user: betabank
